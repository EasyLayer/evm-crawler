<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>EVM Crawler — Electron</title><style>
body { font-family: monospace; padding: 20px; background: #111827; color: #e5e7eb; }
h2 { color: #60a5fa; }.status { margin: 8px 0; padding: 6px 12px; border-radius: 4px; display: inline-block; }
.status.loading { background: #374151; color: #9ca3af; }.status.ready { background: #064e3b; color: #34d399; }
.panel { background: #111; padding: 14px; border-radius: 6px; margin-top: 14px; border: 1px solid #1f2937; }.panel-title { color: #93c5fd; margin-bottom: 8px; }
.stat { display: inline-block; min-width: 220px; margin-right: 14px; }.stat-label { display: block; font-size: 11px; color: #9ca3af; }.stat-value { display: block; font-size: 16px; color: #f9fafb; }
input { background: #374151; color: #e5e7eb; border: 1px solid #4b5563; padding: 6px 8px; border-radius: 4px; width: 520px; }
button { background: #2563eb; color: #fff; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; margin-right: 8px; } button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
pre { white-space: pre-wrap; word-break: break-word; } #log { background: #0b1220; padding: 12px; border-radius: 6px; margin-top: 14px; max-height: 240px; overflow-y: auto; font-size: 11px; color: #6ee7b7; } .log-entry { border-bottom: 1px solid #1f2937; padding: 2px 0; }
</style></head><body>
<h2>EVM Crawler — Electron</h2><p style="color:#9ca3af;font-size:12px">Crawler runs in the <strong>Electron main process</strong>. Renderer talks to it via <code>electron-ipc</code>.</p>
<div id="status" class="status loading">⏳ Waiting for crawler...</div>
<div style="margin-top:12px"><span class="stat"><span class="stat-label">Last indexed block</span><span class="stat-value" id="stat-height">—</span></span><span class="stat"><span class="stat-label">Total native balance (wei)</span><span class="stat-value" id="stat-balance">—</span></span></div>
<div style="margin-top:14px"><label style="color:#9ca3af;font-size:12px">Addresses (comma-separated):<br/><input id="addresses" value="0xd8da6bf26964af9d7eed9e03e53415d37aa96045" /></label></div>
<div style="margin-top:10px"><button id="btn-query" onclick="queryAll()" disabled>🔄 Refresh</button><button id="btn-live" onclick="toggleLive()" disabled>▶ Live (3s)</button></div>
<div class="panel"><div class="panel-title">💰 GetBalanceQuery result</div><pre id="result-balance">—</pre></div><div id="log"></div>
<script>
let liveInterval = null;
function log(msg) { const el = document.getElementById('log'); const div = document.createElement('div'); div.className = 'log-entry'; div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`; el.prepend(div); while (el.children.length > 100) el.removeChild(el.lastChild); }
async function queryBalance() { const addresses = document.getElementById('addresses').value.split(',').map((value) => value.trim()).filter(Boolean); try { const result = await window.crawlerAPI.query('GetBalanceQuery', { addresses }); document.getElementById('result-balance').textContent = JSON.stringify(result, null, 2); const total = Object.values(result || {}).reduce((sum, value) => sum + BigInt(value || 0), 0n); document.getElementById('stat-balance').textContent = total.toString() + ' wei'; log(`← balance: ${JSON.stringify(result)}`); } catch (error) { log(`← balance error: ${error.message}`); } }
async function queryNetworkModel() { try { const models = await window.crawlerAPI.query('GetModelsQuery', { modelIds: ['network'] }); const model = Array.isArray(models) ? models[0] : models; if (model?.blockHeight != null) document.getElementById('stat-height').textContent = model.blockHeight; log(`← network model: blockHeight=${model?.blockHeight}, version=${model?.version}`); } catch (error) { log(`← model error: ${error.message}`); } }
async function queryAll() { log('→ querying balance + network model...'); await Promise.all([queryBalance(), queryNetworkModel()]); }
function toggleLive() { const btn = document.getElementById('btn-live'); if (liveInterval) { clearInterval(liveInterval); liveInterval = null; btn.textContent = '▶ Live (3s)'; log('Live updates stopped'); } else { queryAll(); liveInterval = setInterval(queryAll, 3000); btn.textContent = '⏹ Stop'; log('Live updates started (every 3s)'); } }
async function waitForCrawler() { const statusEl = document.getElementById('status'); const btnQuery = document.getElementById('btn-query'); const btnLive = document.getElementById('btn-live'); log('Waiting for crawler to initialize...'); while (true) { try { const ready = await window.crawlerAPI.isReady(); if (ready) break; } catch {} await new Promise((resolve) => setTimeout(resolve, 500)); } statusEl.textContent = '✅ Crawler ready'; statusEl.className = 'status ready'; btnQuery.disabled = false; btnLive.disabled = false; log('Crawler ready — starting live updates'); queryAll(); liveInterval = setInterval(queryAll, 3000); document.getElementById('btn-live').textContent = '⏹ Stop'; }
waitForCrawler();
</script></body></html>
